<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Funcionário</title>
    <link rel="shortcut icon" href="//img//favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/style_funcionario.css">  
</head>
<body>

    <div class="conteiner">
        <h1>Login Funcionário</h1>

        <form id="formFuncionario">

            <div class="colunas">
                <div class="coluna1">
                    <p>E-mail</p>
                    <input type="text" name="email" placeholder="Digite seu E-mail"> 

                    <p>Senha</p>
                    <input type="password" name="senha" placeholder="Digite sua Senha"> 

                    <p>Confirmar senha</p>
                    <input type="password" name="confirmar_senha" placeholder="Confirme sua Senha"> 
                </div>
            </div>

            <!-- BOTÃO CORRIGIDO -->
            <button type="button" onclick="window.location.href='./telas/html/cadastro_produtos.html'">
                Entrar
            </button>

        </form>

    </div>

</body>
</html>
