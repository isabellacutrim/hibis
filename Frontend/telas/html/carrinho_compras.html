<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/style_carrinho.css">
    <title>Carrinho de Compra</title>
</head>
<body>

    <aside class="conteiner">
        <h1>Carrinho</h1>

        <!-- AQUI OS ITENS DO CARRINHO VÃO APARECER -->
        <div id="lista-carrinho"></div>

        <div class="total">
            <p id="total">Total: R$ 0,00</p>
        </div>
    </aside>

   <!-- <button id="btnFinalizar">Finalizar Compra</button>-->

<script>
async function carregarCarrinho() {
    const id_cliente = 1; // coloque o id certo aqui

    const resposta = await fetch(`http://localhost:3000/carrinho/listar/2`);
    const itens = await resposta.json();

    const lista = document.getElementById("lista-carrinho");
    const totalSpan = document.getElementById("total");

    lista.innerHTML = "";
    let total = 0;

    itens.forEach(item => {
        total += Number(item.valorProduto) * item.quantidade;

        lista.innerHTML += `
            <div class="item">
                <img src="${item.imagem}">
                <h3>${item.nomeProduto}</h3>
                <p>Quantidade: ${item.quantidade}</p>
                <p>Preço: R$ ${Number(item.valorProduto).toFixed(2)}</p>
            </div>
        `;
    });

    totalSpan.textContent = "Total: R$ " + total.toFixed(2);
}

carregarCarrinho();
</script>


</body>
</html>
