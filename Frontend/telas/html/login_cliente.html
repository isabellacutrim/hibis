<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Usuário</title>
    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/style_Logincliente.css">  
</head>
<body>

    <div class="conteiner">
        <h1>Login Usuário</h1>

        <form action="/login" method="get" id="formCliente">
            <div class="colunas">
                <div class="coluna1">
                    <p>E-mail</p>
                    <input type="text" name="cpf" placeholder="Digite seu E-mail"> 

                    <p>Senha</p>
                    <input type="text" name="nome_completo" placeholder="Digite sua Senha"> 

                    <button 
                        type="button" 
                        class="botao-texto" 
                        onclick="window.location.href='cadastro_cliente.html'">
                        Não possui conta? Cadastre-se aqui
                    </button>
                </div>
            </div>

            <button type="submit" class="botao-entrar">Entrar</button>
        </form>
    </div>

</body>
</html>
