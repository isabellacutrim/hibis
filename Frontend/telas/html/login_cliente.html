<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Usuário</title>
    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/style_Logincliente.css">  
</head>
<body>

    <div class="conteiner">
        <h1>Login Usuário</h1>

        <form action="/cliente/login" method="POST" id="loginCliente">
            <div class="colunas">
                <div class="coluna1">
                    <p>E-mail</p>
                    <input type="text" name="email" placeholder="Digite seu E-mail"> 

                    <p>Senha</p>
                    <input type="text" name="senha" placeholder="Digite sua Senha"> 

                    <button 
                        type="button" 
                        class="botao-texto" 
                        onclick="window.location.href='cadastro_cliente.html'">
                        Não possui conta? Cadastre-se aqui
                    </button>
                </div>
            </div>

            <div id="mensagem"></div>

            <button type="submit" class="botao-entrar">Entrar</button>
        </form>
    </div>

</body>
</html>
