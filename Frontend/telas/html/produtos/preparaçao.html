<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preparação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/telas/css/telasProduto.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ======= SIDEBAR ======= -->
    <aside class="sidebar">
        <a href="/index.html"><img src="/img/home.png" alt="Home"></a>
        <span>Preparação</span>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item active" id="breadcrumbCategoria">Categoria</li>
            </ol>
        </nav>
        
        <h1 id="tituloCategoria" class="mb-4">Produtos</h1>
        
        <div id="loadingProdutos" class="loading">
            Carregando produtos...
        </div>
        
        <div id="produtosContainer" class="products">
            <!-- Os produtos serão carregados dinamicamente aqui -->
        </div>
        
        <div id="mensagemVazio" style="display: none; text-align: center; padding: 40px;">
            <p>Nenhum produto encontrado nesta categoria.</p>
        </div>
    </main>

    <script>
        // Obter o ID da categoria da URL
        const caminho = window.location.pathname.split('/');
        const categoriaId = caminho[caminho.length - 1];
        
        // Carregar produtos quando a página carregar
        document.addEventListener('DOMContentLoaded', () => {
            carregarProdutos(categoriaId);
        });
        
        async function carregarProdutos(categoriaId) {
            try {
                const response = await fetch(`http://localhost:3000/Produto/listarProdutos/1`);
                
                if (!response.ok) {
                    throw new Error('Erro ao carregar produtos');
                }
                
                const produtos = await response.json();
                exibirProdutos(produtos);
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('loadingProdutos').innerHTML = 
                    'Erro ao carregar produtos. Tente novamente mais tarde.';
            }
        }
        
        function exibirProdutos(produtos) {
            const container = document.getElementById('produtosContainer');
            const loading = document.getElementById('loadingProdutos');
            const mensagemVazio = document.getElementById('mensagemVazio');
            
            // Esconder loading
            loading.style.display = 'none';
            
            if (produtos.length === 0) {
                mensagemVazio.style.display = 'block';
                return;
            }
            
            // Atualizar breadcrumb e título
            if (produtos.length > 0) {
                document.getElementById('breadcrumbCategoria').textContent = produtos[0].categoria_nome;
                document.getElementById('tituloCategoria').textContent = produtos[0].categoria_nome;
            }
            
            // Gerar HTML para cada produto
            container.innerHTML = produtos.map(produto => `
                <div class="card" onclick="irParaDetalhes(${produto.codProduto})">
                    <img src="${produto.imagem}" alt="${produto.nomeProduto}">
                    <h3 class="title">${produto.nomeProduto}</h3>
                    <p class="price">R$ ${produto.valorProduto}</p>
                    <button onclick="event.stopPropagation(); adicionarAoCarrinho(${produto.id})">
                        Adicionar ao carrinho
                    </button>
                </div>
            `).join('');
        }
        
        function irParaDetalhes(produtoId) {
            window.location.href = `/produto/${produtoId}`;
        }
        
        function adicionarAoCarrinho(produtoId) {
            // Aqui você implementaria a lógica do carrinho
            alert('Produto adicionado ao carrinho!');
        }
    </script>
</body>
</html>
