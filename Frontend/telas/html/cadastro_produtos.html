<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de produtos</title>
    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/telas/css/style_produto.css">

</head>
<body>

        <div class="conteiner">
        <h1>Cadastro de Produtos</h1>

        <form action="/Produto/cadastroProduto" method="POST" id="formProduto">
            <div class="colunas">
                <div class="coluna1">
                    <p>Nome</p>
                    <input type="text" name="nomeProduto" placeholder="Digite o nome do produto"> 
                    <p>Código</p>
                    <input type="code" name="codProduto" placeholder="Confirme o código do produto"> 
                    <p>Confirmar código</p>
                    <input type="code" name="confCod" placeholder="Confirme o código do produto"> 

                </div>

                <div class="coluna2">
                    <p>Categoria</p>
                    <input type="text" name="classificProduto" placeholder="Informe a categoria do produto"> 
                    <p>Quantidade</p>
                    <input type="number" name="quantidade" placeholder="Informe a quantidade"> 
                    <p>Valor unitário</p>    
                    <input type="text" name="valorProduto" placeholder="Digite o valor do produto">  
                </div>
            </div>

            <button type="submit">Cadastrar</button>
            </div>
       </form>
    </div>
</body>
</html>
